<body>

<!-- 1. Início: apresentação, atalhos (continuar, favoritos) e escolha da idade -->
<section id="idades" class="tela ativa">
  <div class="rolagem">
    <header class="inicio-topo">
      <h1 class="titulo">Brincar e Aprender</h1>
      <p class="inicio-sub">Jogos educativos com voz para crianças de 1 a 10 anos</p>
      <div class="selos" id="selos"></div>
    </header>
    <div class="atalhos" id="atalhos"></div>
    <h2 class="secao-titulo destaque">Qual é a idade?</h2>
    <div class="lista-idades" id="lista-idades"></div>
  </div>
</section>

<!-- 2. Jogos da faixa escolhida, por categoria -->
<section id="menu" class="tela">
  <div class="rolagem" id="rolagem-menu">
    <header class="menu-topo">
      <h1 class="titulo" id="titulo-menu"></h1>
      <p class="menu-sub" id="sub-menu"></p>
    </header>
    <div id="lista-jogos"></div>
  </div>
</section>

<!-- 3. O jogo em si -->
<section id="jogo" class="tela">
  <!-- Nome do jogo, na tela de escolher o modo -->
  <div class="cabecalho-jogo" id="cabecalho-jogo" hidden></div>
  <div id="area-jogo"></div>
</section>

<!-- Voltar uma tela (o "voltar" do celular faz o mesmo) -->
<button class="canto voltar" id="btn-voltar" aria-label="Voltar" style="display:none"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M27 10 13 24l14 14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 24h20" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg></button>
<!-- Início: nas telas de escolha do jogo, volta direto para a tela inicial -->
<button class="canto inicio" id="btn-inicio" aria-label="Voltar para o início" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 24 24 10l16 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 22v16h7v-9h6v9h7V22" fill="#fff"/></svg></button>
<!-- Saiu da tela cheia no meio da partida: aviso por alguns segundos para voltar -->
<button id="aviso-tela-cheia" hidden>⛶ Voltar para a tela cheia</button>
<!-- Tela cheia: liga e desliga (Esc também sai); fica só no início e nos menus -->
<button class="canto tela-cheia" id="btn-tela-cheia" aria-label="Tela cheia" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><path class="abrir" d="M8 18V8h10M30 8h10v10M40 30v10H30M18 40H8V30" fill="none" stroke="#2b5d8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="fechar" d="M18 8v10H8M40 18H30V8M30 40V30h10M8 30h10v10" fill="none" stroke="#2b5d8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<!-- Como jogar (só nos jogos que têm explicação, na tela inicial do jogo) -->
<button class="canto ajuda" id="btn-ajuda" aria-label="Como jogar" hidden>❓</button>

<!-- Aparece quando há uma versão nova do app (não aparece durante os jogos) -->
<button id="btn-atualizar" hidden>🆕 Nova versão! Toque aqui ou puxe a tela para baixo</button>
<!-- Puxar a tela para baixo (no início e nos menus) procura e instala versão nova -->
<div id="puxar" aria-live="polite"><span class="seta">⬇️</span><span class="texto"></span></div>
